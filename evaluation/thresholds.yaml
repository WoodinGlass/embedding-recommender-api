# =============================================================================
# Evaluation thresholds (ADR-0010).
#
# The gate reads this file and compares it against evaluation/report.json.
# A run below any threshold or any absolute floor fails the gate.
#
# Thresholds are chosen by a human after reviewing a measured baseline; they
# are not auto-computed. Lowering a threshold requires a reason and a new
# entry in thresholds_history.yaml. See docs/adr/0010-evaluation-thresholds.md.
#
# Values below are placeholders. They will be replaced after the first
# `make eval` produces a measured report (M2.5f); the current values are
# deliberately permissive so the CI job is green from the first commit.
# =============================================================================
schema_version: 1
golden_set_version: "v1"

# Systems whose metrics are logged and reviewed but do NOT fail a build.
# A new evaluation arm lands here until a first measurement exists to set
# a meaningful threshold. A threshold of 0.00 in the gate section would
# be a gate that cannot fail; listing the arm here is honest about the
# fact that no threshold exists yet.
#
# Promotion to the gate section: after the arm has a measured baseline in
# evaluation/report.json, set its threshold to `measured - 0.05` (or the
# maintainer's chosen margin) and remove it from this list. Record the
# decision in thresholds_history.yaml.
informational:
  - exact_knn_blend
  - pgvector_hnsw_blend
  - pgvector_hnsw_blend_mmr

# Absolute floors: a run below any floor fails the gate regardless of the
# per-system thresholds. These encode the minimum quality this project
# considers acceptable for the sample catalog. They are not derived from
# theory; they are the maintainer's starting point and will be revised
# once a real measurement exists.
absolute_floor:
  pgvector_hnsw:
    recall_at_10: 0.70
    ndcg_at_10: 0.65
    mrr: 0.70
    ann_recall_vs_exact: 0.90
  exact_knn:
    recall_at_10: 0.70
    ndcg_at_10: 0.65
    mrr: 0.70
    ann_recall_vs_exact: 1.00

# Per-system thresholds. Baselines have 0.00 because that is what they
# should score -- there is no upward fluctuation to accommodate. A baseline
# that fails 0.00 is a bug in the baseline, and failing the gate is the
# correct response.
pgvector_hnsw:
  recall_at_10: 0.85
  ndcg_at_10: 0.80
  mrr: 0.85
  ann_recall_vs_exact: 0.90

exact_knn:
  recall_at_10: 0.85
  ndcg_at_10: 0.80
  mrr: 0.85
  ann_recall_vs_exact: 1.00

popularity_synthetic:
  recall_at_10: 0.00
  ndcg_at_10: 0.00
  mrr: 0.00
  ann_recall_vs_exact: null

random_baseline:
  recall_at_10: 0.00
  ndcg_at_10: 0.00
  mrr: 0.00
  ann_recall_vs_exact: null
