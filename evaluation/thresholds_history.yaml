# =============================================================================
# Evaluation thresholds history (ADR-0010).
#
# Every change to thresholds.yaml appends an entry here. Lowering a
# threshold requires a reason. The gate does not enforce the presence of a
# reason -- that is a code review matter -- but this file makes the absence
# visible in a diff.
# =============================================================================
schema_version: 1
entries:
  - date: "2026-10-08T00:00:00Z"
    golden_set_version: "v1"
    commit: "pending-first-measurement"
    change: "initial thresholds"
    measured:
      note: >-
        No measured baseline yet. These are the maintainer's starting
        points, chosen to be permissive enough that the CI job is green
        from the first commit. They will be replaced with
        measured-minus-margin once `make eval` produces its first report.
    new_thresholds:
