        ndcg_at_10: 0.80
        mrr: 0.85
        ann_recall_vs_exact: 1.00
      popularity_synthetic:
        recall_at_10: 0.00
        ndcg_at_10: 0.00
        mrr: 0.00
      random_baseline:
