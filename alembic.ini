# Alembic configuration.
#
# The database URL is not set here. It is read from the DATABASE_URL
# environment variable in migrations/env.py, so that a migration run in a
# different environment does not require editing this file.
#
# Usage:
#   alembic upgrade head           # apply all migrations
#   alembic downgrade -1           # revert the last migration
#   alembic revision -m "..."      # create an empty revision file
#   alembic current                # show the current revision
#
# See docs/ops.md for the backup and restore procedure that precedes any
# migration in a running environment.

[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks: migrations are reviewed as written.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
