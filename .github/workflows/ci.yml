# =============================================================================
# ci.yml — fast, deterministic gates on every push to main and every PR.
#
# Design notes:
# - Each job has one responsibility so failures are easy to localise.
# - Every Python step runs through the Makefile. Local and CI use the same
#   commands, so a green `make check` locally means a green `make check` in CI.
# - The [dev-lite] extra is used for lint and unit tests so a PR does not wait
#   for a ~800 MB torch download. Heavier extras are installed only where
#   needed.
# - The docker job is the only job that exercises the container, and it serves
#   /healthz against a freshly built image.
# =============================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR runs; keep every push-to-main run for history.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_DEFAULT_TIMEOUT: "100"

jobs:
  # ---------------------------------------------------------------------------
  # Lint and type check
  # ---------------------------------------------------------------------------
  lint:
    name: lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev-lite]"
      - name: Ruff
        run: make lint
      - name: mypy
        run: make typecheck
      - name: Test marker discipline
        run: make check-markers

  # ---------------------------------------------------------------------------
  # Unit tests — matrix on the versions README claims to support
  # ---------------------------------------------------------------------------
  test-unit:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev-lite]"
      - name: Run unit tests
        run: make test-unit

  # ---------------------------------------------------------------------------
  # Integration tests against real PostgreSQL (pgvector) and Redis
  # ---------------------------------------------------------------------------
  test-integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: recsys
          POSTGRES_PASSWORD: recsys
          POSTGRES_DB: recsys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recsys -d recsys"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RECSYS_TEST_DATABASE_URL: postgresql://recsys:recsys@localhost:5432/recsys
      RECSYS_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev-lite,db,cache]"
      - name: Ensure pgvector extension exists
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=recsys psql -h localhost -U recsys -d recsys -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Run integration tests
        # Light tier: PostgreSQL (pgvector) and Redis only. Encoder parity
        # runs in the dedicated `test-encoder` job because it needs torch
        # and the HF hub, which are heavy and independent of the DB.
        run: make test-integration

  # ---------------------------------------------------------------------------
  # Encoder parity: ONNX artifact vs sentence-transformers reference
  #
  # Runs as a separate job so that the general integration job stays fast
  # (no torch, no HF download) while the parity gate still executes on every
  # push to main and every PR. The HF hub cache makes the second and later
  # runs a few seconds instead of a minute.
  # ---------------------------------------------------------------------------
  test-encoder:
    name: encoder parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache HuggingFace hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev-lite,inference,export]"
      - name: Run encoder parity tests
        env:
          # Enable the strict (byte-identical) determinism tier. ONNX
          # Runtime + BLAS bit-level output is only guaranteed stable with
          # pinned thread counts; the ONNX encoder is configured with
          # intra_op=inter_op=1, and this env var tells the test suite to
          # assert the strict contract. Locally, without this variable, the
          # strict tier is skipped and only semantic + tolerance run.
          RECSYS_STRICT_DETERMINISM: "1"
        run: make test-encoder

  # ---------------------------------------------------------------------------
  # Evaluation gate: build an index, run offline evaluation, enforce thresholds
  #
  # This job is the M2 exit criterion. It provisions the same pgvector
  # service container as test-integration, applies migrations, embeds the
  # sample catalog, builds and promotes an index, and runs `make eval`.
  # The gate fails the build when any metric is below its threshold or its
  # absolute floor (ADR-0010).
  #
  # The report is uploaded as an artifact on every run, passing or failing,
  # so a failure can be inspected after the fact.
  # ---------------------------------------------------------------------------
  evaluation:
    name: evaluation gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: recsys
          POSTGRES_PASSWORD: recsys
          POSTGRES_DB: recsys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recsys -d recsys"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://recsys:recsys@localhost:5432/recsys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev-lite,db,pipeline,inference,export]"
      - name: Ensure pgvector extension exists
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=recsys psql -h localhost -U recsys -d recsys -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Produce ONNX artifact
        run: python scripts/export_onnx.py --model sentence-transformers/all-MiniLM-L6-v2
      - name: Embed the sample catalog
        run: |
          python -m recsys.embeddings.pipeline --mode=batch \
            --catalog data/sample/catalog.jsonl \
            --out artifacts/embeddings \
            --quiet
      - name: Build the index
        run: python scripts/build_index.py > /tmp/build.json
      - name: Promote the index
        run: |
          INDEX_VERSION=$(python -c "import json; print(json.load(open('/tmp/build.json'))['index_version'])")
          echo "Promoting ${INDEX_VERSION}"
          python scripts/promote_index.py --index-version "$INDEX_VERSION"
      - name: Run the evaluation gate
        run: make eval
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: evaluation/report.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Docker build + smoke test of /healthz
  # ---------------------------------------------------------------------------
  docker-build:
    name: docker build & smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: recsys:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # All smoke checks run in a single step: GitHub Actions executes each
      # `run:` in a fresh shell, and the EXIT trap cleans up the container at
      # the end of the step. Splitting would make the container disappear
      # before the next step could reach it.
      - name: Smoke test /healthz, /readyz, /metrics
        run: |
          set -euo pipefail

          # The container runs with APP_ENV=prod, which activates the prod
          # guard in Settings (docs/adr/0013, docs/contracts.md section 3.1):
          # API_KEYS must be an Argon2id hash (plaintext is dev-only),
          # JWT_SECRET must be >= 32 chars and not the sentinel,
          # USER_ID_HASH_SALT must be set and its version >= 1.
          # The hash below is a real Argon2id hash for the literal key
          # "ci-smoke-key"; it is a CI fixture, not a production secret.
          docker run -d --name recsys-ci \
            -e APP_ENV=prod \
            -e API_KEYS='$argon2id$v=19$m=65536,t=3,p=4$f48R4vy/N6bUuleK8T6HMA$IoErucGQGhmYbEoTEvEzLm5uI+97gyTMvPAVpN39f9E' \
            -e JWT_SECRET=ci-smoke-secret-not-the-default-and-long-enough \
            -e USER_ID_HASH_SALT=ci-smoke-salt-not-the-default-value \
            -e USER_ID_HASH_SALT_VERSION=1 \
            -p 8000:8000 recsys:ci

          # No --rm: the container must survive its own crash long enough for
          # the trap to read its logs. The trap removes it either way.
          trap 'echo "--- container logs ---"; docker logs recsys-ci || true; docker rm -f recsys-ci || true' EXIT

          echo "--- waiting for /healthz ---"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              echo
              echo "healthz responded after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "healthz did not respond within 30s" >&2
              exit 1
            fi
            sleep 1
          done

          echo "--- /readyz ---"
          curl -fsS http://127.0.0.1:8000/readyz
          echo

          echo "--- /metrics ---"
          curl -fsS http://127.0.0.1:8000/metrics | grep -q "recsys_active_index_info"
          echo "metrics contains recsys_active_index_info"
          echo "all smoke checks passed"

          echo "--- waiting for /healthz ---"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              echo
              echo "healthz responded after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "healthz did not respond within 30s" >&2
              exit 1
            fi
            sleep 1
          done

          echo "--- /readyz ---"
          curl -fsS http://127.0.0.1:8000/readyz
          echo

          echo "--- /metrics ---"
          curl -fsS http://127.0.0.1:8000/metrics | grep -q "recsys_active_index_info"
          echo "metrics contains recsys_active_index_info"
          echo "all smoke checks passed"
