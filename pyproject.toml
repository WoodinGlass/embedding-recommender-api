[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "embedding-recommender-api"
version = "0.1.0"
description = "Embedding-based recommendation service with low-latency ANN retrieval, re-ranking, and statistically valid A/B testing."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "WoodinGlass" }]
keywords = [
  "recommender-systems", "embeddings", "ann", "pgvector", "hnsw", "faiss",
  "fastapi", "ab-testing", "mlops", "observability",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

# All runtime dependencies live in optional-dependency groups so that each
# capability can be installed and reasoned about on its own.
dependencies = []

[project.urls]
Homepage = "https://github.com/WoodinGlass/embedding-recommender-api"
Repository = "https://github.com/WoodinGlass/embedding-recommender-api"
Issues = "https://github.com/WoodinGlass/embedding-recommender-api/issues"

# =============================================================================
# Optional dependencies — capability groups (each self-contained)
# =============================================================================
[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "python-multipart>=0.0.9",
]
db = [
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "alembic>=1.13,<2.0",
  "pgvector>=0.3,<1.0",
]
cache = [
  "redis>=5.0,<6.0",
]
# Reads experiments.yaml and config/hot.yaml at API startup (ADR-0017,
# ADR-0022). The pipeline and the eval script also read YAML, but they
# carry pyyaml through [dev-lite].
config = [
  "pyyaml>=6.0,<7.0",
]
auth = [
  "pyjwt>=2.9,<3.0",
  # Argon2id is the hash ADR-0013 uses for API keys; bcrypt is not
  # installed because nothing uses it.
  "passlib[argon2]>=1.7,<2.0",
]
# Runtime: online ONNX inference. No torch, no sentence-transformers.
# The M3 API and the M1.3 batch pipeline install only this.
inference = [
  "numpy>=1.26,<3.0",
  "onnxruntime>=1.19,<2.0",
  "tokenizers>=0.20,<1.0",
]
# Offline: export a sentence-transformers model to ONNX. Pulls torch.
# Used by the export script and the encoder parity test; never at serve time.
export = [
  "sentence-transformers>=3.0,<4.0",
  "onnx>=1.16,<2.0",
]
# Meta: everything embedding-related. Convenience for local dev and CI.
embeddings = [
  "embedding-recommender-api[inference,export,pipeline]",
]
observability = [
  "structlog>=24.4,<26.0",
  "prometheus-client>=0.20,<1.0",
  "opentelemetry-api>=1.27,<2.0",
  "opentelemetry-sdk>=1.27,<2.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
]
experiments = [
  "numpy>=1.26,<3.0",
  "scipy>=1.14,<2.0",
  "statsmodels>=0.14,<1.0",
]
churn = [
  "scikit-learn>=1.5,<2.0",
  "pandas>=2.2,<3.0",
]
# Batch pipeline: [inference] plus Parquet I/O. The API image (M3) installs
# [inference] only, so pyarrow never reaches production serving. Orchestration
# (Prefect, Airflow) is deferred to M6 and will add its own group then; see
# docs/adr/0003-plain-python-cli-for-embedding-pipeline.md.
pipeline = [
  "embedding-recommender-api[inference]",
  # pyarrow <17 has no wheel for Python 3.13, and pyarrow <18 has no
  # wheel for 3.13 either (the primary dev environment is Colab, which
  # runs 3.13). The upper bound is kept below 19 so a future breaking
  # change does not land silently; the exact version is recorded in
  # every manifest (see docs/embedding-pipeline.md § 2), and the
  # determinism suite re-runs on any bump.
  "pyarrow>=17.0,<19.0",
]
bench = [
  "faiss-cpu>=1.8,<2.0",
]
load = [
  "locust>=2.31,<3.0",
]

# --- meta groups ---
service = [
  "embedding-recommender-api[api,db,cache,auth,config,observability]",
]
# dev-lite: everything needed for lint and unit tests, without the heavy
# ML runtime (torch/sentence-transformers) or the pipelines. CI uses this for
# the fast gates so a PR does not wait on a ~800 MB download.
dev-lite = [
  # cache is included so mypy sees redis-py's real signatures when
  # it type-checks the limiter and the cache store. Without it, the
  # import in those modules resolves to Any, the call is not checked,
  # and a `# type: ignore[no-untyped-call]` on the redis call becomes
  # an "unused ignore" error in the lint job. That is a class of
  # failure that only shows up in CI; the extra keeps the two
  # environments consistent. redis-py has no compiled extension, so
  # the install cost is negligible.
  "embedding-recommender-api[api,auth,cache,observability]",
  # tests
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  "anyio>=4.4,<5.0",
  # quality
  # Pinned to the same version as the pre-commit config (see
  # .pre-commit-config.yaml). Three places — Colab, the pre-commit
  # hook environment, and CI — must run the same ruff, or the same
  # commit can pass in one and fail in another for reasons that have
  # nothing to do with the code.
  "ruff==0.16.10",
  "mypy>=1.11,<2.0",
  "pre-commit>=3.8,<5.0",
  # scripts/
  "pyyaml>=6.0,<7.0",
  # encoder protocol unit tests use numpy without pulling onnxruntime
  "numpy>=1.26,<3.0",
  # artifact writer unit tests use pyarrow without pulling the encoder
  "pyarrow>=17.0,<19.0",
]
# dev: full local environment. Superset of dev-lite.
dev = [
  "embedding-recommender-api[dev-lite,service,embeddings,experiments,churn,bench,load]",
]

# =============================================================================
# Build targets
# =============================================================================
[tool.hatch.build.targets.wheel]
packages = ["src/recsys"]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "tests/",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pyproject.toml",
]

# =============================================================================
# Ruff
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["migrations/versions", "notebooks"]

[tool.ruff.lint]
select = [
  "E", "W", "F",     # pycodestyle / pyflakes
  "I",               # isort
  "N",               # pep8-naming
  "UP",              # pyupgrade
  "B",               # bugbear
  "C4",              # comprehensions
  "SIM",             # simplify
  "RUF",             # ruff-specific
  "S",               # bandit
  "PT",              # pytest-style
  "T20",             # no print
  "ARG",             # unused args
]
ignore = [
  "S101",   # assert (allowed in tests, guarded elsewhere)
  "B008",   # function call in default arg (FastAPI Depends)
  "RUF001", "RUF002", "RUF003",  # ambiguous unicode in strings/comments
]

[tool.ruff.lint.per-file-ignores]
# S311 (no pseudo-random for crypto) does not apply to tests: a
# seeded `Random(seed)` is how a test pins jitter to a fixed value.
"tests/**"     = ["S101", "S311", "ARG001", "ARG002", "T20"]
"pipelines/**" = ["T20"]
"scripts/**"   = ["T20"]
"evaluation/**"= ["T20"]

# scripts/sample_catalog_data.py is content, not code: one (title, description)
# tuple per line. Splitting tuples across lines to satisfy E501 would add ~240
# lines of noise for zero review benefit — a reviewer reading this file in a
# browser should see one item per line.
"scripts/sample_catalog_data.py" = ["E501"]

# pipeline.py is a CLI: printing to stdout (summary) and stderr (progress) is
# the intended behaviour, not a debugging leftover. T201 forbids print
# everywhere else on purpose.
"src/recsys/embeddings/pipeline.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["recsys"]

# The formatter wraps long lines regardless of per-file lint ignores, and it
# has no per-file line-length override. This file is content: one (title,
# description) tuple per line is more readable than a wrapped tuple. Excluding
# it from the formatter is the honest way to keep that layout, while ruff
# check still inspects it with the E501 ignore declared above.
[tool.ruff.format]
exclude = ["scripts/sample_catalog_data.py"]

# =============================================================================
# mypy
# =============================================================================
[tool.mypy]
# mypy parses transitive dependencies (in Colab, jax pulls in PEP 695
# syntax that requires 3.12). The project targets 3.11 but the CI matrix
# tests both 3.11 and 3.12; setting mypy to 3.12 lets it parse modern
# stubs while still checking our code under ``strict``. Our own code
# avoids 3.12-only syntax, and the 3.11 CI job would fail if it did not.
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
show_error_codes = true
files = ["src", "tests", "scripts"]
exclude = ["^migrations/versions/"]

[[tool.mypy.overrides]]
module = [
  "faiss.*",
  "onnxruntime.*",
  "sentence_transformers.*",
  "pgvector.*",
  "locust.*",
  "passlib.*",
  "psycopg.*",
  "redis.*",
  "yaml.*",
  "pyarrow.*",
  "jax.*",
  "jaxlib.*",
  "jwt.*",
]
ignore_missing_imports = true
# Some transitive dependencies (in our case jax, pulled in by
# transformers on Colab) use Python 3.12+ syntax. mypy parses their
# stubs when resolving our imports from sentence-transformers, fails on
# the syntax, and stops before checking our code. ``ignore_errors`` is
# needed in addition to ``ignore_missing_imports`` because the error is
# inside a stub mypy chose to load, not a "module not found".
ignore_errors = true

# =============================================================================
# pytest
# =============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: fast, no external services (default)",
  "integration: requires PostgreSQL (pgvector) and/or Redis",
  "encoder: requires [inference,export] extras (onnxruntime + torch + sentence-transformers)",
  "slow: takes more than a few seconds",
  "load: Locust/k6 load test scenarios",
]

# =============================================================================
# coverage
# =============================================================================
[tool.coverage.run]
source = ["src/recsys"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
